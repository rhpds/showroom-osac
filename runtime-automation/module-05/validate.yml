---
# Read-only checks. The Usage API POST is a probe and not part of the checks that mutate the platform.
- import_playbook: ../bastion.yml

- name: Module 05 - Metering and Billing Validation
  hosts: bastion
  gather_facts: false
  vars_files:
    - ../vars.yml
  environment:
    KUBECONFIG: "{{ bastion_kubeconfig }}"
    NO_COLOR: '1'
  tasks:
    - name: Read the Helm release values
      ansible.builtin.command: helm get values osac -n {{ osac_namespace }} -o json
      register: r_values
      changed_when: false
      failed_when: false

    - name: Read the release status
      ansible.builtin.command: helm status osac -n {{ osac_namespace }} -o json
      register: r_status
      changed_when: false
      failed_when: false

    - name: Read the adapter deployment, secret and Kafka user
      ansible.builtin.command: "{{ item.cmd }}"
      loop:
        - {key: deploy, cmd: "oc get deploy osac-metering-m360-adapter -n {{ osac_namespace }} -o json"}
        - {key: secret, cmd: "oc get secret {{ m360_secret_name }} -n {{ osac_namespace }} -o json"}
        - {key: kafkauser, cmd: "oc get kafkauser osac-metering-m360-adapter -n osac-kafka -o json"}
      loop_control:
        label: "{{ item.key }}"
      register: r_objects
      changed_when: false
      failed_when: false

    - name: Read recent adapter logs
      ansible.builtin.command: oc logs deploy/osac-metering-m360-adapter -n {{ osac_namespace }} --since=5m
      register: r_logs
      changed_when: false
      failed_when: false

    - name: Probe the Usage API with the stored key
      ansible.builtin.uri:
        url: "{{ m360_api_url }}/api/v1/external/run/bmaas/event"
        method: POST
        headers:
          Authorization: >-
            Bearer {{ (r_objects.results[1].stdout | from_json).data['api-key'] | b64decode
            if r_objects.results[1].rc == 0 else '' }}
        body_format: json
        body:
          event_id: "{{ tenant_user }}-validate-{{ lookup('pipe', 'date +%s') }}"
          usage_quantity: "60"
          usage_unit: second
        validate_certs: false
      register: r_api
      failed_when: false
      no_log: true

    - name: Build validation results
      vars:
        values: "{{ (r_values.stdout | from_json) if r_values.rc == 0 else {} }}"
        adapter: "{{ values.get('metering', {}).get('m360Adapter', {}) }}"
        deploy: "{{ (r_objects.results[0].stdout | from_json) if r_objects.results[0].rc == 0 else {} }}"
        secret: "{{ (r_objects.results[1].stdout | from_json) if r_objects.results[1].rc == 0 else {} }}"
        kafkauser: "{{ (r_objects.results[2].stdout | from_json) if r_objects.results[2].rc == 0 else {} }}"
        user_ready: >-
          {{ kafkauser.get('status', {}).get('conditions', []) | selectattr('type', 'equalto', 'Ready')
             | selectattr('status', 'equalto', 'True') | list | length > 0 }}
      ansible.builtin.set_fact:
        module05_checks:
          Helm release is deployed: "{{ (r_status.stdout | from_json).info.status == 'deployed' if r_status.rc == 0 else false }}"
          m360 adapter is enabled and points to the Usage API: >-
            {{ adapter.get('enabled', false) | bool and adapter.get('m360', {}).get('apiUrl', '') == m360_api_url and
               adapter.get('m360', {}).get('apiKeySecret', '') == m360_secret_name }}
          API key secret has the api-key entry: "{{ 'api-key' in secret.get('data', {}) }}"
          Adapter deployment is ready: >-
            {{ deploy.get('status', {}).get('readyReplicas', 0) | int >= 1 }}
          Adapter Kafka user is ready: "{{ user_ready }}"
          Adapter is not failing on Kafka lag: "{{ 'context deadline exceeded' not in r_logs.stdout }}"
          Usage API accepts events with the stored key: "{{ r_api.json.success | default(false) | bool }}"

    - name: Show validation results
      ansible.builtin.debug:
        msg: "{{ 'ok' if item.value | bool else 'FAIL' }}: {{ item.key }}"
      loop: "{{ module05_checks | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Validate all tasks
      ansible.builtin.assert:
        that: module05_checks.values() | map('bool') | reject('equalto', true) | list | length == 0
        success_msg: All Module 05 checks passed.
        fail_msg: Module 05 checks failed. See FAIL messages above.
