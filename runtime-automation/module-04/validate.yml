---
# Read-only cluster checks. Authentication only updates the CLI configs.
- import_playbook: ../bastion.yml

- name: Module 04 - Bare Metal as a Service Validation
  hosts: bastion
  gather_facts: false
  vars_files:
    - ../vars.yml
  environment:
    KUBECONFIG: "{{ bastion_kubeconfig }}"
    NO_COLOR: '1'
  tasks:
    - name: Check requested validation state
      ansible.builtin.assert:
        that: bmaas_expected_state in ['running', 'released']
        fail_msg: bmaas_expected_state must be running or released

    - name: Authenticate platform administrator and Alice
      ansible.builtin.import_tasks: auth.yml

    - name: Read BMaaS catalog, type, image and Alice's instance
      ansible.builtin.command:
        argv:
          - osac
          - --config
          - "{{ item.config }}"
          - get
          - "{{ item.kind }}"
          - "{{ item.name }}"
          - -o
          - json
      loop:
        - {key: catalog, config: "{{ config_alice }}", kind: baremetalinstancecatalogitem, name: "{{ bmaas_catalog_item }}"}
        - {key: instance_type, config: "{{ config_admin }}", kind: baremetalinstancetype, name: "{{ bmaas_instance_type }}"}
        - {key: image, config: "{{ config_admin }}", kind: diskimage, name: "{{ bmaas_disk_image }}"}
        - {key: instance, config: "{{ config_alice }}", kind: baremetalinstance, name: "{{ bmaas_instance_name }}"}
      loop_control:
        label: "{{ item.key }}"
      register: r_objects
      changed_when: false
      failed_when: false

    - name: Normalize API objects including missing resources
      vars:
        result: "{{ (item.stdout | from_json) if item.rc == 0 else {} }}"
      ansible.builtin.set_fact:
        bmaas_objects: >-
          {{ bmaas_objects | default({}) | combine({item.item.key:
             (result if result is mapping else (result | first | default({})))}) }}
      loop: "{{ r_objects.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    - name: Read BMaaS host
      ansible.builtin.command: >-
        oc get bmh {{ bmaas_vm_name }} -n {{ osac_namespace }} --ignore-not-found -o json
      register: r_host
      changed_when: false
      failed_when: false

    - name: Read matching hub instance by public API ID
      ansible.builtin.command: >-
        oc get baremetalinstance -n {{ osac_namespace }}
        -l osac.openshift.io/baremetalinstance-uuid={{ bmaas_objects.instance.get('id', 'missing') }} -o json
      register: r_hub
      changed_when: false
      failed_when: false

    - name: Read Metal3 namespace configuration
      ansible.builtin.command: oc get provisioning provisioning-configuration -o json
      register: r_provisioning
      changed_when: false
      failed_when: false

    - name: Normalize Kubernetes objects
      ansible.builtin.set_fact:
        bmaas_host: "{{ (r_host.stdout | from_json) if r_host.rc == 0 and r_host.stdout | length > 0 else {} }}"
        bmaas_hubs: "{{ (r_hub.stdout | from_json).get('items', []) if r_hub.rc == 0 else [] }}"
        bmaas_provisioning: "{{ (r_provisioning.stdout | from_json) if r_provisioning.rc == 0 else {} }}"

    - name: Select guest IPv4 address
      ansible.builtin.set_fact:
        bmaas_guest_ip: >-
          {{ bmaas_host.get('status', {}).get('hardware', {}).get('nics', [])
             | selectattr('mac', 'equalto', bmaas_vm_mac) | selectattr('ip', 'defined')
             | rejectattr('ip', 'search', ':') | map(attribute='ip') | first | default('') }}

    - name: Check guest access through BMF
      when:
        - bmaas_expected_state == 'running'
        - bmaas_guest_ip | length > 0
        - bmaas_objects.instance.get('id', '') | length > 0
      ansible.builtin.command:
        argv:
          - ssh
          - -i
          - "{{ bastion_home }}/.ssh/id_ed25519"
          - -o
          - BatchMode=yes
          - -o
          - IdentitiesOnly=yes
          - -o
          - StrictHostKeyChecking=accept-new
          - -o
          - UserKnownHostsFile={{ bastion_home }}/.ssh/bmaas-{{ bmaas_objects.instance.id }}-known-hosts
          - -o
          - ConnectTimeout=10
          - -o
          - "ProxyCommand=sudo ssh -W %h:%p root@{{ bmf }}"
          - core@{{ bmaas_guest_ip }}
          - cat /etc/os-release
      register: r_ssh
      changed_when: false
      failed_when: false

    - name: Build shared validation results
      ansible.builtin.set_fact:
        module04_checks:
          Metal3 watches hosts in the OSAC namespace: "{{ bmaas_provisioning.get('spec', {}).get('watchAllNamespaces', false) | bool }}"
          Alice can see the published BMaaS catalog item: >-
            {{ bmaas_objects.catalog.get('published', false) | bool and
               bmaas_objects.catalog.get('template', {}).get('id', '') == bmaas_template }}
          BMaaS instance type selects isolated BMaaS capacity: >-
            {{ bmaas_objects.instance_type.get('spec', {}).get('host_label_selector', {}).get('match_labels', {}).get('osac.openshift.io/host-type', '') == bmaas_host_type }}
          Shared RHCOS disk image is available: >-
            {{ bmaas_objects.image.get('metadata', {}).get('tenant', '') == 'shared' and
               bmaas_objects.image.get('spec', {}).get('lifecycle', '') == 'DISK_IMAGE_LIFECYCLE_AVAILABLE' }}
          BMaaS host is healthy with the expected MAC and selector: >-
            {{ bmaas_host.get('status', {}).get('operationalStatus', '') == 'OK' and
               bmaas_host.get('status', {}).get('errorMessage', '') == '' and
               bmaas_host.get('metadata', {}).get('deletionTimestamp', '') == '' and
               bmaas_host.get('spec', {}).get('bootMACAddress', '') == bmaas_vm_mac and
               bmaas_host.get('metadata', {}).get('labels', {}).get('osac.openshift.io/host-type', '') == bmaas_host_type }}
          BMaaS host uses non-cleaning UEFI Redfish provisioning: >-
            {{ bmaas_host.get('spec', {}).get('bootMode', '') == 'UEFI' and
               bmaas_host.get('spec', {}).get('automatedCleaningMode', '') == 'disabled' and
               bmaas_host.get('spec', {}).get('bmc', {}).get('address', '').startswith('redfish-virtualmedia+http://' ~ bmf ~ ':8000/') }}

    - name: Add running instance checks
      when: bmaas_expected_state == 'running'
      vars:
        instance: "{{ bmaas_objects.instance }}"
        hub: "{{ bmaas_hubs | first | default({}) }}"
      ansible.builtin.set_fact:
        module04_checks: >-
          {{ module04_checks | combine({
            'Alice owns a running instance in the expected tenant':
              (instance.get('metadata', {}).get('name', '') == bmaas_instance_name and
               instance.get('metadata', {}).get('tenant', '') == tenant_name and
               instance.get('status', {}).get('state', '') == 'BARE_METAL_INSTANCE_STATE_RUNNING'),
            'Order uses the expected catalog, shared type, image and Always strategy':
              (instance.get('spec', {}).get('catalog_item', {}).get('name', '') == bmaas_catalog_item and
               instance.get('spec', {}).get('instance_type', {}).get('name', '') == bmaas_instance_type and
               instance.get('spec', {}).get('instance_type', {}).get('shared', false) | bool and
               instance.get('spec', {}).get('disk_image', {}).get('name', '') == bmaas_disk_image and
               instance.get('spec', {}).get('run_strategy', '') == 'BARE_METAL_INSTANCE_RUN_STRATEGY_ALWAYS'),
            'Public API ID maps to exactly one hub instance on this host':
              (bmaas_hubs | length == 1 and
               hub.get('spec', {}).get('externalHostID', '') == osac_namespace ~ '/' ~ bmaas_vm_name and
               hub.get('metadata', {}).get('annotations', {}).get('osac.openshift.io/tenant', '') == tenant_name),
            'Order includes the expected registered SSH key or a legacy public key':
              (instance.get('spec', {}).get('ssh_key', {}).get('name', '') == bmaas_ssh_key_secret or
               instance.get('spec', {}).get('ssh_public_key', '') | length > 0),
            'RHCOS first-boot user data is attached to the host':
              (bmaas_host.get('spec', {}).get('userData', {}).get('name', '') | length > 0),
            'Provisioned host is claimed by that hub instance UID':
              (bmaas_host.get('status', {}).get('provisioning', {}).get('state', '') == 'provisioned' and
               hub.get('metadata', {}).get('uid', '') | length > 0 and
               bmaas_host.get('spec', {}).get('consumerRef', {}).get('name', '') == hub.get('metadata', {}).get('uid', 'missing')),
            'Host is online and physically powered on':
              (bmaas_host.get('spec', {}).get('online', false) | bool and bmaas_host.get('status', {}).get('poweredOn', false) | bool),
            'Guest accepts the injected SSH key and runs RHCOS':
              (r_ssh.rc | default(1) == 0 and 'Red Hat Enterprise Linux CoreOS' in r_ssh.stdout | default(''))
          }) }}

    - name: Add released host checks
      when: bmaas_expected_state == 'released'
      ansible.builtin.set_fact:
        module04_checks: >-
          {{ module04_checks | combine({
            'Alice instance is absent after release':
              (r_objects.results[3].rc == 0 and bmaas_objects.instance | length == 0),
            'Host returned to available with no consumer':
              (bmaas_host.get('status', {}).get('provisioning', {}).get('state', '') == 'available' and
               bmaas_host.get('spec', {}).get('consumerRef', {}).get('name', '') == '')
          }) }}

    - name: Show validation results
      ansible.builtin.debug:
        msg: "{{ 'ok' if item.value else 'FAIL' }}: {{ item.key }}"
      loop: "{{ module04_checks | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Validate all tasks
      ansible.builtin.assert:
        that: module04_checks.values() | reject('equalto', true) | list | length == 0
        success_msg: "All Module 04 checks passed ({{ bmaas_expected_state }})."
        fail_msg: "Module 04 checks failed. See FAIL messages above; allow provisioning or release to finish before validating again."
