---
- import_playbook: ../bastion.yml

- name: Module 04 - Bare Metal as a Service Solve
  hosts: bastion
  gather_facts: false
  vars_files:
    - ../vars.yml
  environment:
    KUBECONFIG: "{{ bastion_kubeconfig }}"
    NO_COLOR: '1'
  tasks:
    - name: Authenticate platform administrator and Alice
      ansible.builtin.import_tasks: auth.yml

    - name: Check that the BMaaS template is available
      ansible.builtin.command: >-
        osac --config {{ config_admin }} get baremetalinstancetemplate {{ bmaas_template }} -o json
      register: r_template
      changed_when: false
      failed_when: r_template.rc != 0 or bmaas_template not in r_template.stdout

    - name: Check Metal3 namespace scope
      ansible.builtin.command: >-
        oc get provisioning provisioning-configuration -o jsonpath={.spec.watchAllNamespaces}
      register: r_watch
      changed_when: false
      failed_when: r_watch.rc != 0 or r_watch.stdout != 'true'

    - name: Check Sushy Redfish service
      ansible.builtin.uri:
        url: "http://{{ bmf }}:8000/redfish/v1/Systems"
        status_code: 200

    - name: Record CaaS host identity and allocation before solving
      ansible.builtin.command: oc get bmh {{ vm_name }} -n {{ osac_namespace }} --ignore-not-found -o json
      register: r_caas_before
      changed_when: false

    - name: Read Alice's existing bare-metal instance
      ansible.builtin.command: >-
        osac --config {{ config_alice }} get baremetalinstance {{ bmaas_instance_name }} -o json
      register: r_existing
      changed_when: false

    - name: Normalize the instance lookup
      vars:
        result: "{{ r_existing.stdout | from_json }}"
      ansible.builtin.set_fact:
        existing_instance: "{{ result if result is mapping else (result | first | default({})) }}"

    - name: Read existing host without modifying it
      ansible.builtin.command: >-
        oc get bmh {{ bmaas_vm_name }} -n {{ osac_namespace }} --ignore-not-found -o json
      register: r_existing_host
      changed_when: false

    - name: Normalize host lookup
      ansible.builtin.set_fact:
        existing_host: "{{ (r_existing_host.stdout | from_json) if r_existing_host.stdout | length > 0 else {} }}"

    - name: Find hub instance identity for an existing order
      ansible.builtin.command: >-
        oc get baremetalinstance -n {{ osac_namespace }}
        -l osac.openshift.io/baremetalinstance-uuid={{ existing_instance.get('id', 'missing') }} -o json
      register: r_existing_hub
      changed_when: false

    - name: Read existing hub instance
      ansible.builtin.set_fact:
        existing_hub: "{{ (r_existing_hub.stdout | from_json)['items'] | first | default({}) }}"

    - name: Refuse to reuse a host owned by another workload
      ansible.builtin.assert:
        that:
          - bmaas_vm_name != vm_name
          - bmaas_vm_mac != vm_mac
          - >-
            existing_host.get('spec', {}).get('consumerRef', {}).get('name', '') == '' or
            existing_host.get('spec', {}).get('consumerRef', {}).get('name', '') ==
            existing_hub.get('metadata', {}).get('uid', 'missing')
          - existing_host.get('metadata', {}).get('deletionTimestamp', '') == ''
          - existing_instance.get('metadata', {}).get('deletion_timestamp', '') == ''
          - >-
            existing_instance | length == 0 or
            (existing_instance.get('metadata', {}).get('tenant', '') == tenant_name and
             existing_instance.get('spec', {}).get('catalog_item', {}).get('name', '') == bmaas_catalog_item and
             existing_instance.get('spec', {}).get('instance_type', {}).get('name', '') == bmaas_instance_type)
          - >-
            existing_host.get('metadata', {}).get('labels', {}).get('osac.openshift.io/host-type', bmaas_host_type)
            == bmaas_host_type
        fail_msg: >-
          The selected host is CaaS capacity, is deleting, or belongs to another workload.
          Use a separate BMaaS host; do not delete or relabel an occupied host.

    - name: Generate SSH key if missing
      ansible.builtin.command:
        argv: [ssh-keygen, -q, -t, ed25519, -N, '', -f, "{{ bastion_home }}/.ssh/id_ed25519"]
        creates: "{{ bastion_home }}/.ssh/id_ed25519"

    - name: Create a separate BMaaS VM on the BMF host
      ansible.builtin.shell: |
        sudo ssh {{ bmf | quote }} bash -s <<'EOF'
        set -euo pipefail
        if virsh -c qemu:///system dominfo {{ bmaas_vm_name | quote }} >/dev/null 2>&1; then
          echo exists
          exit 0
        fi
        virt-install --name {{ bmaas_vm_name | quote }} \
          --memory 8192 --vcpus 4 \
          --disk size=60,format=qcow2,bus=virtio,pool=default \
          --network network=default,mac={{ bmaas_vm_mac }} \
          --boot loader=/usr/share/edk2/ovmf/OVMF_CODE.fd,loader_ro=yes,loader_type=pflash,nvram_template=/usr/share/edk2/ovmf/OVMF_VARS.fd \
          --os-variant rhel9-unknown --import --noautoconsole
        EOF
      register: r_vm
      changed_when: "'exists' not in r_vm.stdout"

    - name: Check existing VM firmware and MAC before enrollment
      ansible.builtin.shell: |
        set -euo pipefail
        sudo ssh {{ bmf | quote }} virsh -c qemu:///system dumpxml {{ bmaas_vm_name | quote }} > /tmp/osac-bmaas-domain.xml
        python3 - <<'PY'
        import xml.etree.ElementTree as ET
        root = ET.parse('/tmp/osac-bmaas-domain.xml').getroot()
        assert root.findtext('os/loader') == '/usr/share/edk2/ovmf/OVMF_CODE.fd', 'Expected non-secure-boot OVMF firmware'
        assert '{{ bmaas_vm_mac }}' in [n.get('address') for n in root.findall('devices/interface/mac')], 'Unexpected VM MAC'
        PY
      args:
        executable: /bin/bash
      changed_when: false

    - name: Read VM UUID
      ansible.builtin.command: sudo ssh {{ bmf }} virsh -c qemu:///system domuuid {{ bmaas_vm_name }}
      register: r_uuid
      changed_when: false

    - name: Enroll the new host with its BMC credentials
      when: existing_host | length == 0
      no_log: true
      ansible.builtin.shell: |
        oc apply -f - <<'EOF'
        {{ bmc_secret | to_nice_yaml }}
        ---
        {{ host_manifest | to_nice_yaml }}
        EOF
      vars:
        bmc_secret:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ bmaas_vm_name }}-bmc-secret"
            namespace: "{{ osac_namespace }}"
          type: Opaque
          stringData:
            username: admin
            password: "{{ osac_user_password }}"
        host_manifest:
          apiVersion: metal3.io/v1alpha1
          kind: BareMetalHost
          metadata:
            name: "{{ bmaas_vm_name }}"
            namespace: "{{ osac_namespace }}"
            labels:
              osac.openshift.io/host-type: "{{ bmaas_host_type }}"
          spec:
            online: true
            bootMACAddress: "{{ bmaas_vm_mac }}"
            bootMode: UEFI
            automatedCleaningMode: disabled
            rootDeviceHints:
              deviceName: /dev/vda
            bmc:
              address: "redfish-virtualmedia+http://{{ bmf }}:8000/redfish/v1/Systems/{{ r_uuid.stdout | trim }}"
              credentialsName: "{{ bmaas_vm_name }}-bmc-secret"
              disableCertificateVerification: true
      register: r_enroll
      changed_when: "'created' in r_enroll.stdout or 'configured' in r_enroll.stdout"

    - name: Wait for unclaimed host inspection to complete
      when: existing_instance | length == 0
      ansible.builtin.command: oc get bmh {{ bmaas_vm_name }} -n {{ osac_namespace }} -o json
      register: r_available
      changed_when: false
      until:
        - (r_available.stdout | from_json).status.provisioning.state == 'available'
        - (r_available.stdout | from_json).status.operationalStatus == 'OK'
        - (r_available.stdout | from_json).spec.get('consumerRef', {}).get('name', '') == ''
      retries: 60
      delay: 20

    - name: Read BMaaS instance type
      ansible.builtin.command: >-
        osac --config {{ config_admin }} get baremetalinstancetype {{ bmaas_instance_type }} -o json
      register: r_type
      changed_when: false

    - name: Create isolated BMaaS instance type if missing
      when: r_type.stdout | from_json | length == 0
      ansible.builtin.command: >-
        osac --config {{ config_admin }} create baremetalinstancetype
        --name {{ bmaas_instance_type }} --description "RHDP BMaaS libvirt host"
        --cpu-cores 4 --cpu-architecture amd64 --cpu-threads-per-core 1 --memory-total-gb 8
        --network-port enp1s0:fabric:Ethernet:10Gbps
        --host-label osac.openshift.io/host-type={{ bmaas_host_type }}
      changed_when: true

    - name: Check the selector of an existing instance type
      when: r_type.stdout | from_json | length > 0
      vars:
        result: "{{ r_type.stdout | from_json }}"
        profile: "{{ result if result is mapping else result | first }}"
      ansible.builtin.assert:
        that:
          - profile.spec.host_label_selector.match_labels.get('osac.openshift.io/host-type', '') == bmaas_host_type
        fail_msg: The existing hardware profile does not select isolated BMaaS capacity.

    - name: Read shared RHCOS image
      ansible.builtin.command: osac --config {{ config_admin }} get diskimage {{ bmaas_disk_image }} -o json
      register: r_image
      changed_when: false

    - name: Create shared RHCOS image if missing
      when: r_image.stdout | from_json | length == 0
      ansible.builtin.command: >-
        osac --config {{ config_admin }} create diskimage --name {{ bmaas_disk_image }}
        --source-type registry --source-ref oci://quay.io/osac-project/rhcos:4.22.0 --architecture amd64
      changed_when: true

    - name: Wait for the shared RHCOS image to be available before ordering
      ansible.builtin.command: >-
        osac --config {{ config_admin }} get diskimage {{ bmaas_disk_image }} -o json
      register: r_ready_image
      changed_when: false
      vars:
        result: "{{ r_ready_image.stdout | from_json }}"
        image: "{{ result if result is mapping else (result | first | default({})) }}"
      until:
        - image.get('metadata', {}).get('tenant', '') == 'shared'
        - image.get('spec', {}).get('lifecycle', '') == 'DISK_IMAGE_LIFECYCLE_AVAILABLE'
      retries: 30
      delay: 10

    - name: Read BMaaS catalog item
      ansible.builtin.command: >-
        osac --config {{ config_admin }} get baremetalinstancecatalogitem {{ bmaas_catalog_item }} -o json
      register: r_catalog
      changed_when: false

    - name: Check an existing catalog item before ordering
      when: r_catalog.stdout | from_json | length > 0
      vars:
        result: "{{ r_catalog.stdout | from_json }}"
        catalog: "{{ result if result is mapping else result | first }}"
      ansible.builtin.assert:
        that:
          - catalog.get('published', false) | bool
          - catalog.get('template', {}).get('id', '') == bmaas_template
        fail_msg: Publish the existing catalog item with the expected BMaaS template before ordering.

    - name: Publish BMaaS catalog item if missing
      when: r_catalog.stdout | from_json | length == 0
      ansible.builtin.command: >-
        osac --config {{ config_admin }} create baremetalinstancecatalogitem
        --name {{ bmaas_catalog_item }} --title "Demo Bare Metal Host"
        --description "Metal3-managed dedicated server" --template {{ bmaas_template }} --published
      changed_when: true

    - name: Read SSH public key
      ansible.builtin.slurp:
        src: "{{ bastion_home }}/.ssh/id_ed25519.pub"
      register: r_key

    - name: Build RHCOS first-boot Ignition configuration
      ansible.builtin.set_fact:
        bmaas_ignition:
          ignition:
            version: 3.4.0
          passwd:
            users:
              - name: core
                sshAuthorizedKeys:
                  - "{{ r_key.content | b64decode | trim }}"

    - name: Detect the deployed CLI's SSH key interface
      ansible.builtin.command: osac create baremetalinstance --help
      register: r_create_help
      changed_when: false

    - name: Select registered key or legacy inline key interface
      ansible.builtin.set_fact:
        bmaas_key_uses_secret: "{{ 'Name of a registered SSH public-key Secret' in r_create_help.stdout }}"

    - name: Look up Alice's registered SSH key
      when: bmaas_key_uses_secret
      ansible.builtin.command: >-
        osac --config {{ config_alice }} get secret {{ bmaas_ssh_key_secret }} -o json
      register: r_key_secret
      changed_when: false
      no_log: true

    - name: Register Alice's public key if missing
      when: bmaas_key_uses_secret and r_key_secret.stdout | from_json | length == 0
      ansible.builtin.command: >-
        osac --config {{ config_alice }} create secret --name {{ bmaas_ssh_key_secret }}
        --type ssh-public-key --from-file=public_key={{ bastion_home }}/.ssh/id_ed25519.pub
      changed_when: true
      no_log: true

    - name: Order Alice's bare-metal instance once
      when: existing_instance | length == 0
      ansible.builtin.command:
        argv:
          - osac
          - --config
          - "{{ config_alice }}"
          - create
          - baremetalinstance
          - --name={{ bmaas_instance_name }}
          - --catalog-item={{ bmaas_catalog_item }}
          - --disk-image={{ bmaas_disk_image }}
          - --set=instance_type.name={{ bmaas_instance_type }}
          - --set=instance_type.shared=true
          - --ssh-key={{ bmaas_ssh_key_secret if bmaas_key_uses_secret else (r_key.content | b64decode | trim) }}
          - --user-data={{ bmaas_ignition | to_json }}
          - --run-strategy=Always
      changed_when: true

    - name: Restart an existing halted instance before waiting for provisioning
      when: >-
        existing_instance.get('spec', {}).get('run_strategy', '') ==
        'BARE_METAL_INSTANCE_RUN_STRATEGY_HALTED'
      ansible.builtin.include_tasks: power.yml
      vars:
        power_strategy: ALWAYS

    - name: Wait for Alice's instance to be running
      ansible.builtin.command: >-
        osac --config {{ config_alice }} get baremetalinstance {{ bmaas_instance_name }} -o json
      register: r_instance
      changed_when: false
      until: (r_instance.stdout | from_json).get('status', {}).get('state', '') == 'BARE_METAL_INSTANCE_STATE_RUNNING'
      retries: 90
      delay: 20

    - name: Locate the hub instance by its public API ID
      ansible.builtin.command: >-
        oc get baremetalinstance -n {{ osac_namespace }}
        -l osac.openshift.io/baremetalinstance-uuid={{ (r_instance.stdout | from_json).id }} -o json
      register: r_hub
      changed_when: false
      failed_when: >-
        r_hub.rc != 0 or (r_hub.stdout | from_json).get('items', []) | length != 1 or
        (r_hub.stdout | from_json)['items'][0].spec.externalHostID != osac_namespace ~ '/' ~ bmaas_vm_name

    - name: Wait for first boot and verify access before changing power
      ansible.builtin.import_tasks: ssh.yml

    - name: Exercise power lifecycle and restore running state
      block:
        - name: Halt and restart through Alice's public API
          ansible.builtin.include_tasks: power.yml
          loop: [HALTED, ALWAYS]
          loop_control:
            loop_var: power_strategy
      always:
        - name: Ensure the instance is left running after the power checks
          ansible.builtin.include_tasks: power.yml
          vars:
            power_strategy: ALWAYS

    - name: Verify guest access after restarting
      ansible.builtin.import_tasks: ssh.yml

    - name: Read CaaS host after solving
      when: r_caas_before.stdout | length > 0
      ansible.builtin.command: oc get bmh {{ vm_name }} -n {{ osac_namespace }} -o json
      register: r_caas_after
      changed_when: false

    - name: Confirm CaaS host identity and allocation are preserved
      when: r_caas_before.stdout | length > 0
      vars:
        before: "{{ r_caas_before.stdout | from_json }}"
        after: "{{ r_caas_after.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - before.metadata.uid == after.metadata.uid
          - before.spec.get('consumerRef', {}) == after.spec.get('consumerRef', {})
        success_msg: CaaS host identity and allocation are unchanged.
