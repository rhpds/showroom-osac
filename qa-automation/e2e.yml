---
# OSAC end-to-end automation.
#
# This playbook is intentionally a thin orchestrator around the existing
# module solve/validate playbooks used by Showroom. Each module is solved and
# then validated before moving to the next module so failures point at the
# module that introduced the problem.

- import_playbook: ../runtime-automation/module-01/solve.yml
- import_playbook: ../runtime-automation/module-01/validate.yml

- import_playbook: ../runtime-automation/module-02/solve.yml
- import_playbook: ../runtime-automation/module-02/validate.yml

- import_playbook: ../runtime-automation/module-03/solve.yml
- import_playbook: ../runtime-automation/module-03/validate.yml

- import_playbook: ../runtime-automation/module-04/solve.yml
- import_playbook: ../runtime-automation/module-04/validate.yml
